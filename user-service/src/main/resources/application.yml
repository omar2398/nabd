spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5433/nabd
    username: postgres
    password: omar
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: nabd-super-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration: 86400000
